[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for the AI Portfolio Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "google-genai>=3.4.0",
    "httpx2>=2.16.0",
    "langchain>=1.5.1",
    "langchain-google-genai>=4.5.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=6.3.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
